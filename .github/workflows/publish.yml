name: Publish

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

jobs:
    validate-tag:
        runs-on: ubuntu-latest
        steps:
            - name: Validate CalVer tag (vYYYY.MM.N)
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  if [[ ! "$TAG" =~ ^v[0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]+$ ]]; then
                      echo "::error::Tag '$TAG' does not match CalVer pattern vYYYY.MM.N (e.g. v2026.04.1)"
                      exit 1
                  fi
                  echo "Tag '$TAG' is a valid CalVer tag."

    publish:
        permissions:
            contents: read
            id-token: write
        needs: validate-tag
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: 1.4.2

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 22.23.2
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Build
              run: bun run build

            # `npm publish` does not substitute "workspace:*" in dependencies; downstream
            # consumers would see the unresolved spec on npm. Rewrite to the actual
            # version (taken from the tag) so the published manifest is installable.
            - name: Rewrite workspace:* deps to exact version
              run: |
                  TAG="${GITHUB_REF#refs/tags/v}"   # e.g. 2026.04.3
                  for f in packages/nestjs/package.json packages/react/package.json; do
                      node -e "const fs=require('fs');const p='$f';const j=JSON.parse(fs.readFileSync(p,'utf8'));for(const d of ['dependencies','peerDependencies']){if(!j[d])continue;for(const k of Object.keys(j[d])){if(j[d][k]==='workspace:*'){j[d][k]='$TAG';}}}fs.writeFileSync(p,JSON.stringify(j,null,4)+'\n');"
                      echo "--- $f ---"
                      cat "$f" | grep -A1 -B1 "$TAG" || true
                  done

            - name: Publish @hfu.digital/boardkit-core
              working-directory: packages/core
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish @hfu.digital/boardkit-nestjs
              working-directory: packages/nestjs
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish @hfu.digital/boardkit-react
              working-directory: packages/react
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    release:
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Create GitHub Release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
              with:
                  generate_release_notes: true
