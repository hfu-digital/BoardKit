name: Publish

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    id-token: write

jobs:
    validate-tag:
        runs-on: ubuntu-latest
        steps:
            - name: Validate CalVer tag (vYYYY.MM.N)
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  if [[ ! "$TAG" =~ ^v[0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]+$ ]]; then
                      echo "::error::Tag '$TAG' does not match CalVer pattern vYYYY.MM.N (e.g. v2026.04.1)"
                      exit 1
                  fi
                  echo "Tag '$TAG' is a valid CalVer tag."

    build:
        needs: validate-tag
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            - name: Test
              run: bun run test

    publish:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            - name: Publish @hfu.digital/boardkit-core
              working-directory: packages/core
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish @hfu.digital/boardkit-nestjs
              working-directory: packages/nestjs
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish @hfu.digital/boardkit-react
              working-directory: packages/react
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    release:
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
