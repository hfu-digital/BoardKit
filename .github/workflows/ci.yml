name: CI
on: [push, pull_request]
jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - run: npm ci
            - run: npx turbo build
            - run: npx turbo lint
            - run: npx turbo test
